<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI ChatGPT - 깔끔한 AI 채팅 인터페이스" />
  <title>AI ChatGPT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="대화 목록">
      <div class="brand"><div class="brand-mark">AI</div><span>AI ChatGPT</span></div>
      <button class="new-chat" id="newChat" type="button"><span aria-hidden="true">＋</span> 새 대화</button>
      <div class="section-label">최근 대화</div>
      <nav class="chat-list" id="chatList">
        <button class="chat-item active" type="button">새로운 대화</button>
        <button class="chat-item" type="button">AI에게 무엇을 물어볼까요?</button>
        <button class="chat-item" type="button">프로젝트 아이디어</button>
      </nav>
      <div class="sidebar-footer">
        <button class="footer-item" type="button">⚙ 설정</button>
        <span class="version">v0.1.0</span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="mobileMenu" type="button" aria-label="메뉴 열기">☰</button>
        <div class="model-name">AI ChatGPT <span>▾</span></div>
        <button class="icon-button" id="openSignup" type="button" aria-label="회원가입">＋</button>
      </header>

      <section class="chat" id="chat" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h1>무엇을 도와드릴까요?</h1>
          <p>질문을 입력하면 AI가 답변해 드립니다.</p>
          <div class="suggestions">
            <button type="button" data-prompt="새로운 프로젝트 아이디어를 추천해줘">💡 프로젝트 아이디어</button>
            <button type="button" data-prompt="오늘 할 일을 효율적으로 정리해줘">📋 할 일 정리</button>
            <button type="button" data-prompt="어려운 개념을 쉽게 설명해줘">📚 쉽게 설명하기</button>
            <button type="button" data-prompt="짧은 이메일을 작성해줘">✍️ 글 작성하기</button>
          </div>
        </div>
      </section>

      <form class="composer-wrap" id="composer">
        <div class="composer">
          <textarea id="messageInput" rows="1" placeholder="메시지를 입력하세요..." aria-label="메시지 입력"></textarea>
          <button class="send-button" id="sendButton" type="submit" aria-label="전송">↑</button>
        </div>
        <p class="disclaimer">AI ChatGPT는 실수를 할 수 있습니다. 중요한 정보는 확인해 주세요.</p>
      </form>
    </main>
  </div>

  <dialog class="signup-dialog" id="signupDialog" aria-labelledby="signupTitle">
    <form class="signup-card" id="signupForm" method="dialog">
      <button class="signup-close" id="closeSignup" type="button" aria-label="닫기">×</button>
      <div class="signup-brand">AI</div>
      <h2 id="signupTitle">회원가입</h2>
      <p class="signup-subtitle">AI ChatGPT를 시작하려면 계정을 만들어 주세요.</p>

      <label for="signupName">이름</label>
      <input id="signupName" name="name" type="text" autocomplete="name" placeholder="이름을 입력하세요" required />

      <label for="signupEmail">이메일</label>
      <input id="signupEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required />

      <label for="signupPassword">비밀번호</label>
      <input id="signupPassword" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="8자 이상 입력하세요" required />

      <label class="terms"><input type="checkbox" required /> <span>서비스 이용약관 및 개인정보 처리방침에 동의합니다.</span></label>
      <button class="signup-submit" type="submit">계정 만들기</button>
      <p class="signup-note">현재는 UI 단계이며 실제 계정 생성 기능은 추후 백엔드 연동 예정입니다.</p>
    </form>
  </dialog>

  <script src="app.js"></script>
  <script>
    const signupDialog = document.getElementById('signupDialog');
    const openSignup = document.getElementById('openSignup');
    const closeSignup = document.getElementById('closeSignup');
    const signupForm = document.getElementById('signupForm');

    openSignup?.addEventListener('click', () => signupDialog.showModal());
    closeSignup?.addEventListener('click', () => signupDialog.close());
    signupDialog?.addEventListener('click', (event) => {
      if (event.target === signupDialog) signupDialog.close();
    });
    signupForm?.addEventListener('submit', (event) => {
      event.preventDefault();
      alert('회원가입 UI가 정상적으로 제출되었습니다. 실제 계정 생성은 백엔드 연동 후 활성화됩니다.');
      signupDialog.close();
      signupForm.reset();
    });
  </script>
</body>
</html>
